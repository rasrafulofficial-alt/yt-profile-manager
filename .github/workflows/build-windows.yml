name: Build Windows EXE

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller==6.16.0

      - name: Download anti-detect browser + fingerprint model
        run: |
          python -m camoufox fetch
          python -c "from camoufox.fpgen_model import ensure_fpgen_model; ensure_fpgen_model()"

      - name: Build YTProfileManager.exe
        shell: pwsh
        run: |
          $docs = (python -c "import googleapiclient, os; print(os.path.join(os.path.dirname(googleapiclient.__file__), 'discovery_cache', 'documents'))").Trim()
          pyinstaller --noconfirm --clean --windowed `
            --name YTProfileManager `
            --icon assets/icon.ico `
            --add-data "assets;assets" `
            --add-data "$docs\drive.v3.json;googleapiclient/discovery_cache/documents" `
            --add-data "$docs\oauth2.v2.json;googleapiclient/discovery_cache/documents" `
            --collect-all camoufox `
            --collect-all fpgen `
            --collect-all playwright `
            --collect-all language_tags `
            --collect-all ua_parser `
            --collect-all ua_parser_builtins `
            --collect-submodules keyring `
            --hidden-import keyring.backends.Windows `
            --hidden-import win32timezone `
            main.py
          Copy-Item GUIDE_BANGLA.txt dist/YTProfileManager/

      - name: Keep the browser aside for the full package
        shell: pwsh
        run: |
          $inst = (python -c "from camoufox.pkgman import INSTALL_DIR; print(INSTALL_DIR)").Trim()
          $ver = (python -c "from camoufox.pkgman import installed_verstr; print(installed_verstr())").Trim()
          New-Item -ItemType Directory -Force staging/browser_bundle | Out-Null
          Move-Item $inst staging/browser_bundle/camoufox
          Set-Content -NoNewline -Encoding ascii staging/browser_bundle/bundle_id.txt "$ver"
          Write-Host "Browser $ver moved aside; this PC now has NO browser installed"

      - name: Self-test the built exe (downloads browser itself, real launch, restart, cookies, child process)
        shell: pwsh
        run: |
          $report = Join-Path $PWD "selftest.txt"
          $p = Start-Process "dist/YTProfileManager/YTProfileManager.exe" -ArgumentList "--selftest", "`"$report`"" -PassThru
          if (-not $p.WaitForExit(1200000)) { $p.Kill(); Write-Host "Self-test timed out" }
          if (Test-Path $report) { Get-Content $report } else { Write-Host "No report written"; exit 1 }
          if (-not (Select-String -Path $report -Pattern "RESULT: PASS" -Quiet)) { exit 1 }

      - name: Zip update + full packages
        shell: pwsh
        run: |
          7z a -tzip -mx=5 YTProfileManager-update-windows.zip ./dist/YTProfileManager | Out-Null
          Move-Item staging/browser_bundle dist/YTProfileManager/browser_bundle
          7z a -tzip -mx=5 YTProfileManager-full-windows.zip ./dist/YTProfileManager | Out-Null
          Get-Item *.zip | ForEach-Object { "{0}  {1:N0} MB" -f $_.Name, ($_.Length/1MB) }

      - name: Publish release
        if: github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[no release]')
        shell: pwsh
        run: |
          $tag = "v1.0.${{ github.run_number }}"
          $notes = @"
          **New PC (first install):** download **YTProfileManager-full-windows.zip** (includes the browser).

          **PC that already has YT Profile Manager:** download **YTProfileManager-update-windows.zip** (much smaller), and replace the old folder's files. Keep client_secret.json.

          Setup guide: GUIDE_BANGLA.txt inside the zip.
          "@
          gh release create $tag YTProfileManager-full-windows.zip YTProfileManager-update-windows.zip `
            --title "YT Profile Manager $tag" --notes $notes

      - name: Upload self-test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: selftest-report
          path: selftest.txt
          if-no-files-found: ignore
