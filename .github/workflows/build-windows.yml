name: Build Windows EXE

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller==6.16.0

      - name: Download anti-detect browser + fingerprint model
        run: |
          python -m camoufox fetch
          python -c "from camoufox.fpgen_model import ensure_fpgen_model; ensure_fpgen_model()"

      - name: Build YTProfileManager.exe
        run: >
          pyinstaller --noconfirm --clean --windowed
          --name YTProfileManager
          --icon assets/icon.ico
          --add-data "assets;assets"
          --collect-all camoufox
          --collect-all fpgen
          --collect-all playwright
          --collect-all language_tags
          --collect-all ua_parser
          --collect-all ua_parser_builtins
          --collect-data googleapiclient
          --collect-submodules keyring
          --hidden-import keyring.backends.Windows
          --hidden-import win32timezone
          main.py

      - name: Add browser bundle and guide
        shell: pwsh
        run: |
          $out = "dist/YTProfileManager"
          $inst = (python -c "from camoufox.pkgman import INSTALL_DIR; print(INSTALL_DIR)").Trim()
          $ver = (python -c "from camoufox.pkgman import installed_verstr; print(installed_verstr())").Trim()
          New-Item -ItemType Directory -Force "$out/browser_bundle" | Out-Null
          Copy-Item -Recurse $inst "$out/browser_bundle/camoufox"
          Set-Content -NoNewline -Encoding ascii "$out/browser_bundle/bundle_id.txt" "$ver"
          Copy-Item GUIDE_BANGLA.txt "$out/"
          Write-Host "Browser $ver bundled from $inst"

      - name: Self-test the built exe (real browser, restart, cookies, child process)
        shell: pwsh
        run: |
          $report = Join-Path $PWD "selftest.txt"
          $p = Start-Process "dist/YTProfileManager/YTProfileManager.exe" -ArgumentList "--selftest", "`"$report`"" -PassThru
          if (-not $p.WaitForExit(600000)) { $p.Kill(); Write-Host "Self-test timed out" }
          if (Test-Path $report) { Get-Content $report } else { Write-Host "No report written"; exit 1 }
          if (-not (Select-String -Path $report -Pattern "RESULT: PASS" -Quiet)) { exit 1 }

      - name: Size report
        shell: pwsh
        run: |
          function Show-Sizes($path) {
            Get-ChildItem $path | ForEach-Object {
              $len = (Get-ChildItem $_.FullName -Recurse -File -ErrorAction SilentlyContinue | Measure-Object Length -Sum).Sum
              "{0,8:N0} MB  {1}" -f ($len/1MB), $_.Name
            } | Sort-Object -Descending | Select-Object -First 25
          }
          Write-Host "== dist/YTProfileManager"; Show-Sizes "dist/YTProfileManager"
          Write-Host "== _internal"; Show-Sizes "dist/YTProfileManager/_internal"
          Write-Host "== browser_bundle/camoufox"; Show-Sizes "dist/YTProfileManager/browser_bundle/camoufox"

      - name: Zip
        shell: pwsh
        run: |
          7z a -tzip -mx=5 YTProfileManager-windows.zip ./dist/YTProfileManager | Out-Null
          Get-Item YTProfileManager-windows.zip | Select-Object Name, @{n="MB";e={[math]::Round($_.Length/1MB)}}

      - uses: actions/upload-artifact@v4
        with:
          name: YTProfileManager-windows
          path: YTProfileManager-windows.zip
          retention-days: 14

      - name: Publish release
        if: github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[no release]')
        shell: pwsh
        run: |
          $tag = "v1.0.${{ github.run_number }}"
          gh release create $tag YTProfileManager-windows.zip `
            --title "YT Profile Manager $tag" `
            --notes "Download YTProfileManager-windows.zip, unzip, put client_secret.json next to YTProfileManager.exe, and run it. See GUIDE_BANGLA.txt."

      - name: Upload self-test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: selftest-report
          path: selftest.txt
          if-no-files-found: ignore
